name: Bootstrap ITS Equipement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: "!contains(github.event.head_commit.message, '[skip bootstrap]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source project
        uses: actions/checkout@v4
        with:
          repository: syllalamericaink-cmyk/its-equipement-pret-pour-github
          ref: main
          path: _source_project
          fetch-depth: 1

      - name: Import existing application
        shell: bash
        run: |
          cp -a _source_project/its-equipement/. .
          rm -rf _source_project
          rm -f .github/workflows/bootstrap.yml

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import ITS Equipement source [skip bootstrap]"
          git push
